<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f1a18">
<title>Comandas do salão</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: rápido e firme — ferramenta de salão usada com uma mão, no meio do movimento
   IDEA: a comanda de papel do garçom e o calor da brasa do espetinho
   PICTURE: o mapa de mesas é a própria imagem; a conta fechada vira um cupom de papel
   COLOUR and TYPE: coral da brasa (o mesmo do cardápio), carvão, amarelo do cardápio marcando o 10%; Barlow Condensed + Barlow
   LAYOUT: coluna única de celular, barra fixa embaixo, cardápio e fechamento em folhas de tela cheia */
:root{color-scheme:light dark;
--bg:light-dark(#f5f1ee,#161312);--card:light-dark(#fff,#221d1b);--ink:light-dark(#1f1a18,#f3ece8);
--mute:light-dark(#6c605b,#a99d97);--line:light-dark(#e5ddd8,#382f2b);--soft:light-dark(#efe8e4,#2b2421);
--okc:light-dark(#1d7a4a,#5fd39a);--paid:light-dark(#eef7f1,#17271e);--embsoft:light-dark(#fbe3dd,#3a1f19);--ember:#d9472f;--ember2:light-dark(#b8361f,#ff7a5f);--coal:#1f1a18;--sun:#ffd23f;--sunink:#2b2100;--bad:light-dark(#b42318,#ff8a80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
body.inmesa{padding-bottom:calc(214px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
svg{width:22px;height:22px;flex:none}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.cd,h1,h2,h3{font-family:"Barlow Condensed",Barlow,system-ui,sans-serif;font-weight:700}
.top{position:sticky;top:0;z-index:5;background:var(--coal);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 0 10px}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:48px}
.ttl{flex:1}.ttl small{display:block;font-size:13px;color:#c9bcb6;line-height:1.2}
.ttl h1{margin:0;font-size:32px;line-height:1.05}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#ffffff17;color:#fff}
.clock{font:600 20px "Barlow Condensed",sans-serif;color:#c9bcb6}
.band{background:var(--ember);color:#fff;padding:14px 0 16px}
.stats{display:flex;gap:12px 32px;flex-wrap:wrap}
.stats b{display:block;font:700 30px/1.05 "Barlow Condensed",sans-serif;white-space:nowrap}
.stats span{font-size:14px;color:#ffe3dc}
.hint{font-size:14px;color:var(--mute);margin:16px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;padding:12px 0 20px}
.mesa{min-height:98px;border-radius:16px;background:var(--card);border:2px dashed var(--line);display:flex;flex-direction:column;align-items:flex-start;padding:9px 11px;text-align:left;gap:0}
.mesa .lb{font-size:12px;color:var(--mute)}
.mesa .n{font:700 36px/1 "Barlow Condensed",sans-serif;margin-bottom:auto}
.mesa .s{font-size:13px;color:var(--mute);white-space:nowrap}
.mesa.on{background:var(--ember);color:#fff;border:2px solid var(--ember);box-shadow:0 8px 18px -10px #d9472fcc}
.mesa.on .lb,.mesa.on .s{color:#ffe3dc}
.mesa.addm{align-items:center;justify-content:center;gap:6px;border-color:var(--ember);color:var(--ember2);background:transparent}
.mesa.addm svg{width:30px;height:30px}.mesa.addm .s{color:var(--ember2);font-weight:600}
.mesa .v{font:700 18px/1.1 "Barlow Condensed",sans-serif;white-space:nowrap}
.empty{text-align:center;padding:48px 12px;color:var(--mute)}
.empty .big{font:700 64px/1 "Barlow Condensed",sans-serif;color:var(--line);margin-bottom:6px}
.lines{display:flex;flex-direction:column;gap:8px;padding:14px 0}
.line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px 6px 6px}
.step{display:flex;align-items:center;background:var(--soft);border-radius:12px}
.step button{width:38px;height:44px;display:grid;place-items:center}
.step svg{width:18px;height:18px}
.step b{min-width:20px;text-align:center;font:700 21px "Barlow Condensed",sans-serif}
.nmb{text-align:left;padding:4px 0;min-height:44px}
.nm{display:block;font-weight:600;line-height:1.25}
.sl{display:block;font-size:12px;color:var(--mute)}
.ob{display:block;font-size:13px;color:var(--ember2);font-weight:600}
.obh{display:block;font-size:13px;color:var(--mute)}
.pr{font:700 19px "Barlow Condensed",sans-serif;white-space:nowrap;text-align:right}
.pr small{display:block;font:400 12px Barlow,sans-serif;color:var(--mute)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom));box-shadow:0 -10px 24px -18px #0006}
.tot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:10px}
.tot span{display:block;font-size:13px;color:var(--mute)}
.tot b{font:700 26px/1.05 "Barlow Condensed",sans-serif;white-space:nowrap}
.tot .r{text-align:right}
.hl{background:var(--sun);color:var(--sunink);border-radius:8px;padding:0 7px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{min-height:52px;border-radius:14px;font:700 19px "Barlow Condensed",sans-serif;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--ember);color:#fff}.btn.sun{background:var(--sun);color:var(--sunink)}
.btn.gh{border:2px solid var(--line)}.btn.bad{background:var(--bad);color:#fff}
#fechOk{font-size:18px;padding:0 8px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--soft);border-radius:14px;padding:4px;margin:12px 0}
.seg button{min-height:46px;border-radius:10px;font-weight:600;font-size:15px;line-height:1.1}
.seg button.on{background:var(--ember);color:#fff}
.part,.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.part.paid,.pc.paid{background:var(--paid);border-color:var(--okc)}
.pays.sm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}.pays.sm .pay{min-height:40px;padding:0 4px;font-size:14px}
.pv{font:700 24px "Barlow Condensed",sans-serif;white-space:nowrap}
.ppbar{position:sticky;top:0;z-index:2;background:var(--bg);margin:0 -16px;padding:8px 16px;border-bottom:1px solid var(--line)}
.pchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pchip{flex:none;height:42px;padding:0 14px;border-radius:999px;border:2px solid var(--line);font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap;background:var(--card)}
.pchip i,.who i,.pn i{width:10px;height:10px;border-radius:50%;background:var(--pc);display:inline-block;flex:none}
.pchip.on{background:var(--pc);border-color:var(--pc);color:#fff}.pchip.on i{background:#fff}
.pchip.padd{border-style:dashed;background:transparent}
.ppst{font-size:14px;color:var(--mute);margin-top:6px;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center}
.lnk2{color:var(--ember2);font-weight:600;min-height:32px}
.si{padding:10px 0;border-bottom:1px solid var(--line)}.si:last-child{border:0}
.sn b{display:block;font-weight:600}.sn>span{display:block;font-size:13px;color:var(--mute)}
.who{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;margin-top:3px}.who span{display:inline-flex;align-items:center;gap:5px}
.sctl{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:10px}
.rem{font-size:14px;font-weight:700;color:var(--ember2)}.done{font-size:14px;font-weight:700;color:var(--okc)}
.lnk.sm{min-height:38px;font-size:14px;margin-top:6px}
.h3s{font-size:24px;margin:20px 0 4px}
.pn{display:flex;align-items:center;gap:8px;font:700 21px "Barlow Condensed",sans-serif}
.gar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:14px}
.gar>div{background:#00000022;border-radius:12px;padding:8px 10px}.gar span{display:block;font-size:13px;color:#ffe3dc}.gar b{display:block;font:700 22px/1.1 "Barlow Condensed",sans-serif}.gar small{font-size:12px;color:#ffe3dc}
.lockband{padding:12px 0}.lockband span{font-size:15px;color:#ffe9e3}
.lockb{min-height:40px;padding:0 14px;border-radius:999px;background:#00000030;color:#fff;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.lockb svg{width:18px;height:18px}
.tk .real{display:none}.tk[open] .real{display:block}.tk[open] .mask{display:none}
.mask{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;background:var(--soft);color:var(--mute);font-size:14px;font-weight:600}
.grpw{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:14px;overflow:hidden}
.grp+.grp{border-top:1px solid var(--line)}
.grp>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:62px;cursor:pointer}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary div{flex:1}.grp>summary b{display:block;font-weight:600;font-size:17px}.grp>summary span{display:block;font-size:13px;color:var(--mute)}
.grp>summary svg{color:var(--mute);transition:transform .2s}.grp[open]>summary svg{transform:rotate(90deg)}
.gb{padding:0 16px 16px}
.lockc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 18px 18px;margin-top:16px;text-align:center}.lockc svg{width:38px;height:38px;color:var(--ember2)}.lockc h3{margin:8px 0 4px;font-size:26px}
#ntf{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));z-index:60;display:flex;flex-direction:column;gap:6px;width:min(460px,calc(100vw - 20px));pointer-events:none}
.nt{pointer-events:auto;display:flex;gap:8px;align-items:baseline;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:0;border-radius:14px;padding:10px 14px;box-shadow:0 10px 26px -12px #000a;font-size:15px;animation:ntin .25s ease;min-height:44px}
.nt b{flex:none;font:700 19px "Barlow Condensed",sans-serif;color:var(--ember2);white-space:nowrap}
.nt.long{background:var(--sun);color:var(--sunink);border-color:var(--sun)}.nt.long b{color:var(--sunink)}
@keyframes ntin{from{transform:translateY(-10px);opacity:0}}
@media (prefers-reduced-motion:reduce){.nt{animation:none}}
.lvb{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;background:#ffffff17;color:#fff;white-space:nowrap}
.lvb i{width:8px;height:8px;border-radius:50%;background:#9a8f8a}
.lvb.s-on i{background:#5fd39a;box-shadow:0 0 0 3px #5fd39a33}.lvb.s-conn i,.lvb.s-off2 i{background:var(--sun)}.lvb.s-err i,.lvb.s-deny i{background:#ff8a80}
.box .lvb{background:var(--soft);color:var(--ink)}
.live{border:1.5px solid var(--ember)}
.fbhow{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}.fbhow summary{cursor:pointer;min-height:40px;display:flex;align-items:center}
.bandp{margin:0;font-size:15px;color:#fff}
.okp{background:var(--paid);border:1.5px solid var(--okc);border-radius:16px;padding:14px;margin:12px 0}
.warnp{background:light-dark(#fff4e0,#33260f);color:light-dark(#7a4b00,#ffcf7a);border-radius:12px;padding:8px 12px;font-size:14px;margin:6px 0}
.prev{margin-top:14px;border-top:1.5px dashed var(--line);padding-top:12px}.prev>p{margin:0 0 8px}
.lg{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.tg{flex:none;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;margin-top:1px;white-space:nowrap}
.t-new{background:var(--paid);color:var(--okc)}.t-upd{background:var(--embsoft);color:var(--ember2)}.t-off{background:var(--soft);color:var(--mute)}.t-warn{background:var(--sun);color:var(--sunink)}
.how{margin:8px 0 0;padding-left:20px;font-size:15px}.how li{margin:6px 0}
details.box summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
.byo{font-weight:700;color:var(--ember2)}
.btn.zap{background:#25d366;color:#06290d;text-decoration:none}
.kbar{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 6px 0 14px;margin-bottom:8px;border-radius:14px;background:var(--coal);color:#fff;text-align:left;font-size:15px;border:1px solid #ffffff22}
.kbar b{font-weight:700}
.kgo{background:#25d366;color:#06290d;border-radius:10px;padding:0 14px;min-height:40px;display:grid;place-items:center;font:700 18px "Barlow Condensed",sans-serif;white-space:nowrap}
.kn{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--ember);border-radius:6px;padding:0 6px;margin:3px 0 1px}
.ks{display:block;font-size:12px;color:var(--mute)}
.btn.wide{width:100%;justify-content:space-between}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--coal);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0}
.nav button{color:#bdb0aa;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;border-radius:12px}
.nav button[aria-current]{color:#fff;background:#ffffff14}
.nav button[aria-current] svg{color:var(--sun)}
body.inmesa .nav{display:none}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.sheet.open{transform:none;visibility:visible;transition:transform .22s ease}
@media (prefers-reduced-motion:reduce){.sheet,.sheet.open{transition:none}.qc b.pop{animation:none}}
.sheet>header{background:var(--coal);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 0 0}
.sheet>header .row{display:flex;align-items:center;gap:10px;min-height:52px}
.sheet h2{margin:0;font-size:28px;line-height:1.05;flex:1}
.sbody{flex:1;overflow-y:auto;overscroll-behavior:contain;position:relative}
.sheet>footer{background:var(--card);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.srch{position:relative;margin:4px 0 0}
.srch svg{position:absolute;left:12px;top:12px;color:#a99d97}
.srch input{width:100%;height:48px;border-radius:12px;border:0;padding:0 14px 0 42px;font:16px Barlow,sans-serif;background:#ffffff18;color:#fff}
.srch input::placeholder{color:#a99d97}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 12px;scrollbar-width:none;max-width:680px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;background:#ffffff17;color:#fff;font-size:15px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ember)}.chip.alt{background:transparent;border:1.5px dashed #ffffff55}
.sec{padding-top:6px}
.sec h3{font-size:26px;line-height:1.1;margin:18px 0 2px}
.note{margin:0 0 6px;font-size:14px;color:var(--mute)}
.it{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.add{flex:1;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;text-align:left;min-height:58px}
.add .c{font-size:12px;font-weight:600;color:var(--mute);margin-right:6px}
.add .n{font-weight:600;font-size:17px}
.add .d{display:block;font-size:13px;color:var(--mute);line-height:1.3}
.add .x{display:block;font-size:13px;color:var(--bad);font-weight:600}
.add .p{font:700 19px "Barlow Condensed",sans-serif;white-space:nowrap}
.it.off .add{opacity:.5}
.qc{display:none;align-items:center;margin-left:6px}
.it.has .qc{display:flex}
.qc button{width:40px;height:44px;display:grid;place-items:center;color:var(--mute)}
.qc svg{width:18px;height:18px}
.qc b{min-width:34px;height:34px;padding:0 6px;border-radius:10px;background:var(--ember);color:#fff;display:grid;place-items:center;font:700 19px "Barlow Condensed",sans-serif}
.qc b.pop{animation:pop .25s ease}
@keyframes pop{50%{transform:scale(1.25)}}
.rcpt{background:#fff;color:#1f1a18;border-radius:14px 14px 0 0;padding:16px 16px 18px;margin:16px 0 22px;position:relative;font-size:15px;box-shadow:0 10px 24px -18px #0008}
.rcpt::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:radial-gradient(circle at 8px 0,#fff 7.5px,transparent 8px) 0 0/16px 10px repeat-x}
.rcpt h3{margin:0;font-size:24px}.rcpt .meta{font-size:13px;color:#6c605b;margin-bottom:10px}
.rr{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.rr>span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.rs{font-size:12px;color:#8a7f7a;white-space:nowrap}
.rr em{display:block;font-size:13px;color:#b8361f;font-style:normal}
.rr.sep{border-top:1.5px dashed #cfc5c0;margin-top:8px;padding-top:9px}
.rr.big{font:700 22px "Barlow Condensed",sans-serif}
.rr.off{color:#9a8f8a;text-decoration:line-through}
.vals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.val{border-radius:16px;padding:12px 14px;background:var(--card);border:2px solid var(--line)}
.val span{display:block;font-size:14px;color:var(--mute)}
.val b{font:700 clamp(25px,7.5vw,34px)/1.1 "Barlow Condensed",sans-serif;white-space:nowrap}
.val.hi{background:var(--sun);border-color:var(--sun);color:var(--sunink)}.val.hi span{color:#5b4800}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.box h3{margin:0 0 8px;font-size:22px}
.tog{display:flex;align-items:center;gap:12px;min-height:48px;font-weight:600}
.tog input{width:26px;height:26px;accent-color:var(--ember)}
.rowc{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pp{font-size:14px;color:var(--mute);margin-top:6px}
.pays{display:flex;gap:8px;flex-wrap:wrap}
.pay{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);font-weight:600}
.pay.on{background:var(--coal);border-color:var(--coal);color:#fff}
.sum3{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:14px}
.sum3 b{display:block;font:700 clamp(21px,6vw,30px)/1.05 "Barlow Condensed",sans-serif;white-space:nowrap}
.sum3 span{font-size:13px;color:#ffe3dc}
.day{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 6px;gap:10px}
.day h3{margin:0;font-size:24px}.day span{font-size:14px;color:var(--mute);white-space:nowrap}
.tk{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.tk summary{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:12px 14px;cursor:pointer;min-height:56px}
.tk summary::-webkit-details-marker{display:none}
.tk summary b{font:700 21px/1.1 "Barlow Condensed",sans-serif;white-space:nowrap}
.tk summary span{display:block;font-size:13px;color:var(--mute)}
.tk .r{text-align:right}
.tkb{padding:0 14px 14px;font-size:15px}
.tkb .btn{margin-top:10px;width:100%}
.fld{margin:10px 0}
.fld label{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
.fld input,.fld textarea,.er input[type=text],.er input[inputmode]{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:16px Barlow,sans-serif;padding:0 12px}
.fld textarea{height:auto;min-height:90px;padding:10px 12px;resize:vertical}
.cnt{display:flex;align-items:center;gap:4px;background:var(--soft);border-radius:12px}
.cnt button{width:44px;height:44px;display:grid;place-items:center}
.cnt b{min-width:36px;text-align:center;font:700 22px "Barlow Condensed",sans-serif}
.ed summary{display:flex;justify-content:space-between;align-items:center;min-height:52px;font:700 21px "Barlow Condensed",sans-serif;cursor:pointer;border-bottom:1px solid var(--line)}
.ed summary span{font:400 13px Barlow,sans-serif;color:var(--mute)}
.er{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.er input[type=text]{grid-column:1/-1}
.er label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute);white-space:nowrap;min-height:44px}
.er input[inputmode]{text-align:right;padding:0 10px;max-width:130px}
.er input[type=checkbox]{width:24px;height:24px;margin:0;accent-color:var(--ember)}
.er .ib2{width:40px;height:44px;display:grid;place-items:center;color:var(--mute)}
.edx{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.lnk{min-height:44px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.lnk.bad{color:var(--bad)}
.small{font-size:14px;color:var(--mute);margin:4px 0 10px}
.dlg{position:fixed;inset:0;z-index:40;background:#000a;display:none;align-items:flex-end;justify-content:center;padding:12px}
.dlg.open{display:flex}
.dbox{background:var(--card);color:var(--ink);width:100%;max-width:480px;border-radius:20px;padding:18px;margin-bottom:env(safe-area-inset-bottom);max-height:88vh;overflow-y:auto}
.dbox h2{margin:0 0 6px;font-size:28px;line-height:1.1}
.dbox p{margin:0 0 10px;color:var(--mute)}
.dbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.qchips{display:flex;gap:6px;flex-wrap:wrap}
.qchips button{min-height:38px;padding:0 12px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:600}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:8px}
.pick button{min-height:56px;border-radius:12px;border:2px dashed var(--line);font:700 24px "Barlow Condensed",sans-serif;line-height:1}
.pick button.on{border:2px solid var(--ember);color:var(--ember2)}
.pick small{display:block;font:600 11px Barlow,sans-serif}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 6px;border-bottom:1px solid var(--line);font-weight:600;text-align:left}
.opt.bad{color:var(--bad);border:0}
#toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{border:1px solid #ffffff22;position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:50;background:var(--coal);color:#fff;border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;font-weight:600;transition:.2s;max-width:calc(100vw - 24px);box-shadow:0 10px 24px -10px #000a}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--sun);min-height:40px;padding:0 10px;font-weight:700}
#toast button[hidden]{display:none}
textarea.cp{width:100%;min-height:200px;font:14px/1.4 ui-monospace,monospace;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:10px}

function dlg(html,ok){$('#dlgBox').innerHTML=html;$('#dlg').classList.add('open');D.ok=ok||null;setTimeout(()=>{const f=$('#dlgBox [data-focus]');if(f){f.focus();if(f.select)f.select()}},60)}
function closeDlg(){$('#dlg').classList.remove('open');D.ok=null}
function ask(title,text,okLabel,bad,fn){dlg(`<h2>${title}</h2><p>${text}</p><div class="dbtn"><button class="btn gh" data-act="dlgNo">Voltar</button><button class="btn ${bad?'bad':'pri'}" data-act="dlgOk">${okLabel}</button></div>`,fn)}
function showText(title,txt){dlg(`<h2>${title}</h2><p>Selecione o texto e copie.</p><textarea class="cp" readonly data-focus>${esc(txt)}</textarea><div class="dbtn"><span></span><button class="btn pri" data-act="dlgNo">Ok</button></div>`)}
function copy(txt,title,done){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast(done),()=>showText(title,txt))}else showText(title,txt)}

function vMesas(){
  const open=Object.keys(S.orders).filter(m=>S.orders[m].items.length).map(Number);
  const tot=open.reduce((a,m)=>a+subOf(S.orders[m]),0);
  const nums=new Set(Array.from({length:S.mesas},(_,i)=>i+1));open.forEach(m=>nums.add(m));
  const tiles=[...nums].sort((a,b)=>a-b).map(m=>{const o=S.orders[m];
    return o?`<button class="mesa on" data-act="mesa" data-m="${m}"><span class="lb">Mesa</span><span class="n">${m}</span><span class="v">${brl(subOf(o))}</span><span class="s">${qtyOf(o)} ${qtyOf(o)===1?'item':'itens'} · ${ago(o.t)}</span></button>`
    :`<button class="mesa" data-act="mesa" data-m="${m}"><span class="lb">Mesa</span><span class="n">${m}</span><span class="s">livre</span></button>`}).join('');
  const addT=`<button class="mesa addm" data-act="addMesa" aria-label="Criar mesa ${S.mesas+1}">${I.plus}<span class="s">Nova mesa</span></button>`;
  return head('Mesas',(S.name||'Comandas')+(S.sync?` · trocou com ${S.sync.from} às ${hhmm(S.sync.t)}`:''),'',`${liveBadge()}<span class="clock">${hhmm(Date.now())}</span>`)+
  `<div class="band"><div class="wrap stats"><div><b>${open.length}</b><span>${open.length===1?'mesa aberta':'mesas abertas'}</span></div><div><b>${brl(tot)}</b><span>em aberto · com ${S.pct}%: ${brl(tot+svc(tot))}</span></div></div></div>
  <div class="wrap"><p class="hint">Toque numa mesa para abrir ou ver a comanda.</p><div class="grid">${tiles}${addT}</div></div>`;
}

  const gname=h=>!h.bd||h.bd===S.did?(S.dev||'Este celular'):(h.by||'Outro celular');
  const byG={};td.forEach(h=>{const k=gname(h);byG[k]=byG[k]||{s:0,n:0,v:0};byG[k].s+=h.svc;byG[k].n++;byG[k].v+=h.sub+h.svc});const gl=Object.entries(byG);
  const groups={};[...S.hist].sort((a,b)=>b.t1-a.t1).forEach(h=>{(groups[dayKey(h.t1)]=groups[dayKey(h.t1)]||[]).push(h)});
  const list=Object.entries(groups).map(([d,hs])=>{const tot=hs.reduce((a,h)=>a+h.sub+h.svc,0);
    return `<div class="day"><h3>${d===today?'Hoje':d===yest?'Ontem':d}</h3><span>${hs.length} ${hs.length===1?'conta':'contas'}${unlocked?' · '+brl(tot):''}</span></div>`+
    hs.map(h=>`<details class="tk"><summary><div><b>Mesa ${h.m}</b><span>${hhmm(h.t1)}${h.pay?' · '+esc(h.pay):''}${h.bd&&h.bd!==S.did?' · '+esc(h.by||'outro celular'):''}${h.ppl>1?` · ${h.ppl} pessoas`:''}</span></div><div class="r"><span class="mask">Ver valor</span><div class="real"><b>${brl(h.sub+h.svc)}</b><span>${h.svc?`${h.pct}% garçom: ${brl(h.svc)}`:`sem ${h.pct}%`}</span></div></div></summary>
    <div class="tkb">${h.items.map(l=>`<div class="rr"><span>${l.q}× ${esc(l.n)} <small class="rs">${esc(l.s)}</small>${l.o?`<em>${esc(l.o)}</em>`:''}</span><span>${num(l.p*l.q)}</span></div>`).join('')}
    ${h.parts?`<div class="rr sep"><span><b>${h.parts.length} pagamentos</b></span><span></span></div>${h.parts.map(x=>`<div class="rr"><span>${esc(x.n)}${x.pay?' · '+esc(x.pay):''}</span><span>${brl(x.v)}</span></div>`).join('')}`:''}<div class="rr sep"><span>Sem ${h.pct}%</span><span>${brl(h.sub)}</span></div><div class="rr"><span>Com ${h.pct}%</span><span>${brl(h.sub+svc0(h))}</span></div><div class="rr"><span>Aberta ${hhmm(h.t0)} · fechada ${hhmm(h.t1)}</span><span></span></div>
    <button class="btn gh" data-act="reopen" data-id="${h.id}">Reabrir mesa ${h.m}</button></div></details>`).join('')}).join('');
  return head('Fechadas',S.name||'Comandas')+
  (unlocked?`<div class="band"><div class="wrap"><div class="rowc" style="margin-bottom:10px"><b>Totais de hoje</b><button class="lockb" data-act="lockT">Esconder</button></div><div class="sum3"><div><b>${brl(vend)}</b><span>vendas hoje, sem 10%</span></div><div><b>${brl(g)}</b><span>10% do garçom hoje</span></div><div><b>${brl(vend+g)}</b><span>recebido hoje</span></div></div>${gl.length>1?`<div class="gar">${gl.map(([k,x])=>`<div><span>${esc(k)}</span><b>${brl(x.s)}</b><small>10% · ${x.n} ${x.n===1?'conta':'contas'} · ${brl(x.v)}</small></div>`).join('')}</div>`:''}</div></div>`
  :`<div class="band lockband"><div class="wrap rowc"><span>${td.length} ${td.length===1?'conta fechada':'contas fechadas'} hoje. Valores escondidos.</span><button class="lockb" data-act="unlockT">${I.lock} Ver totais</button></div></div>`)+
  `<div class="wrap"><p class="small" style="margin-top:14px">Toque numa conta para ver o valor dela.</p>${list||'<div class="empty"><p>Nenhuma mesa fechada ainda.</p></div>'}${S.hist.length?'<div class="edx" style="margin:20px 0"><button class="lnk bad" data-act="clearHist">'+I.trash+' Limpar histórico</button></div>':''}</div>`;

const PC=['#d9472f','#2e6f8e','#1d7a4a','#c27c0e','#8a4fb5','#b8366b','#4a5a68','#0f8b8d'];
const mkP=i=>({id:uid(),n:'Pessoa '+(i+1),a:{},pay:''});
const shrQ=u=>F.shr.filter(g=>g.u===u).reduce((a,g)=>a+g.q,0);
function alloc(total,ws){const W=ws.reduce((a,b)=>a+b,0);if(!W||!total)return ws.map(()=>0);const raw=ws.map(w=>total*w/W),fl=raw.map(Math.floor);let r=total-fl.reduce((a,b)=>a+b,0);raw.map((x,i)=>[x-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(r>0){fl[i]++;r--}});return fl}
function prepSplit(o){o.items.forEach(l=>{if(!l.u)l.u=uid()});
  if(!o.sp)o.sp={mode:'all',svc:true,pay:'',n:2,parts:[],people:[mkP(0),mkP(1)],shr:[],cur:0};
  F=o.sp;const byU={};o.items.forEach(l=>byU[l.u]=l);
  F.people.forEach(p=>{if(!p.id)p.id=uid()});
  if(!F.shr){F.shr=Object.entries(F.sh||{}).map(([u,q])=>({u,q,who:F.people.map(p=>p.id)}));delete F.sh}
  const ids=new Set(F.people.map(p=>p.id));F.shr=F.shr.filter(g=>byU[g.u]&&g.q>0&&(g.who=g.who.filter(i=>ids.has(i))).length);
  F.people.forEach(p=>{for(const u of Object.keys(p.a))if(!byU[u]||p.a[u]<=0)delete p.a[u]});
  o.items.forEach(l=>{let over=F.people.reduce((a,p)=>a+(p.a[l.u]||0),0)+shrQ(l.u)-l.q;
    for(let j=F.shr.length-1;j>=0&&over>0;j--){const g=F.shr[j];if(g.u!==l.u)continue;const d=Math.min(over,g.q);g.q-=d;over-=d;if(!g.q)F.shr.splice(j,1)}
    for(let i=F.people.length-1;i>=0&&over>0;i--){const p=F.people[i],v=p.a[l.u]||0,d=Math.min(over,v);if(d){p.a[l.u]=v-d;over-=d;if(!p.a[l.u])delete p.a[l.u]}}});
  if(F.cur>=F.people.length)F.cur=0}
const remU=l=>l.q-F.people.reduce((a,p)=>a+(p.a[l.u]||0),0)-shrQ(l.u);
function calcPeople(o){const byU={};o.items.forEach(l=>byU[l.u]=l);const P=F.people.length;
  const own=F.people.map(p=>Object.entries(p.a).reduce((a,[u,q])=>a+(byU[u]?byU[u].p*q:0),0));
  const shp=F.people.map(()=>0),shl=F.people.map(()=>[]);
  F.shr.forEach(g=>{const l=byU[g.u];if(!l)return;const idx=g.who.map(id=>F.people.findIndex(p=>p.id===id)).filter(i=>i>=0);const v=alloc(l.p*g.q,idx.map(()=>1));idx.forEach((pi,k)=>{shp[pi]+=v[k];shl[pi].push({l,q:g.q,k:idx.length,v:v[k]})})});
  const sub=own.map((v,i)=>v+shp[i]);const A=sub.reduce((a,b)=>a+b,0);
  const sv=F.svc?alloc(svc(A),sub):sub.map(()=>0);return{sub,sv,shp,shl,A,left:subOf(o)-A}}
function drawShare(){const l=S.orders[cur].items.find(x=>x.u===SH.u);if(!l)return closeDlg();const r=remU(l),v=l.p*SH.q,k=SH.ids.size;
  dlg(`<h2>Rachar ${esc(l.n)}</h2><p>Toque em quem vai dividir. O resto do pedido continua separado por pessoa.</p>

  const a=b.dataset.act,m=+b.dataset.m,k=+b.dataset.k,id=b.dataset.id,si=+b.dataset.s,ii=+b.dataset.i;
  switch(a){
  case 'nav':view=b.dataset.v;cur=null;unlocked=false;ajOk=false;render();scrollTo(0,0);break;
  case 'unlockT':if(!S.pin){dlg(`<h2>Totais protegidos</h2><p>Para ver os totais do dia, crie uma senha do dono em <b>Ajustes → Privacidade</b>. Sem senha, os totais ficam escondidos.</p><div class="dbtn"><button class="btn gh" data-act="dlgNo">Fechar</button><button class="btn pri" data-act="goPriv">Criar senha</button></div>`);break}
    pinDlg('Ver totais do dia','Digite a senha do dono.',()=>{unlocked=true;render();clearTimeout(window._ut);window._ut=setTimeout(()=>{if(unlocked){unlocked=false;if(view==='hist')render()}},120000)});break;
  case 'lockT':unlocked=false;render();break;
  case 'ajUnlock':pinDlg('Ajustes','Digite a senha do dono.',()=>{ajOk=true;render()});break;
  case 'ajLock':ajOk=false;grpOpen.clear();render();scrollTo(0,0);break;
  case 'goPriv':closeDlg();view='ajustes';render();setTimeout(()=>{const e=$('#privBox');e&&e.scrollIntoView({block:'start'})},50);break;
  case 'pinSet':{const a=$('#pinN').value.trim(),c=$('#pinC').value.trim();if(!/^\d{4,8}$/.test(a)){toast('A senha precisa ter de 4 a 8 números');break}if(a!==c){toast('As duas senhas não batem');break}S.pin=hashPin(a);save();render();toast('Senha trocada');break}
  case 'pinChg':pinDlg('Senha atual','Digite a senha atual para trocar.',()=>{S.pin='';save();render();setTimeout(()=>{const e=$('#pinN');e&&e.focus()},80);toast('Digite a senha nova')});break;
  case 'pinDel':pinDlg('Remover senha','Digite a senha atual. Sem senha, ninguém vê os totais.',()=>{S.pin='';save();render();toast('Senha removida')});break;
  case 'mesa':cur=m;view='mesa';render();scrollTo(0,0);if(!S.orders[m])openPick();break;
  case 'back':view='mesas';cur=null;render();break;
  case 'addItems':openPick();break;
  case 'linc':{const l=S.orders[cur].items[k];l.q++;l.ts=Date.now();save();render();break}
  case 'ldec':{const o=S.orders[cur],l=o.items[k];snap();l.q--;l.ts=Date.now();if(l.q<=0){rmLine(o,k);tidy(cur);toast(l.n+' removido',true)}save();render();break}
  case 'lobs':obsDlg(k);break;
  case 'obsChip':{const t=$('#obsT');t.value=t.value.trim()?t.value.trim()+', '+b.textContent.toLowerCase():b.textContent;break}
  case 'delLine':{snap();const o=S.orders[cur],n=o.items[k].n;rmLine(o,k);tidy(cur);save();closeDlg();render();toast(n+' removido',true);break}
  case 'more':dlg(`<h2>Mesa ${cur}</h2><button class="opt" data-act="move">${I.swap} Trocar ou juntar mesa</button><button class="opt" data-act="kFull">Pedido completo para a cozinha</button><button class="opt" data-act="copyOpen">Copiar conta parcial</button><button class="opt bad" data-act="cancelOrder">${I.trash} Cancelar comanda inteira</button><div class="dbtn"><span></span><button class="btn gh" data-act="dlgNo">Fechar</button></div>`);break;
  case 'move':moveDlg();break;
  case 'moveTo':{const o=S.orders[cur];if(!o)break;snap();ens(o);if(S.orders[m]){const t=S.orders[m];ens(t);t.items.push(...o.items);t.ali=[...new Set([...(t.ali||[]),...ids(o)])];t.del=Object.assign(t.del||{},o.del);if(o.cx)t.cx=(t.cx||[]).concat(o.cx);t.t=Math.min(t.t,o.t);t.mt=Date.now()}else{S.orders[m]=o;o.mt=Date.now()}delete S.orders[cur];const from=cur;cur=m;save();closeDlg();render();toast(`Mesa ${from} → mesa ${m}`,true);break}
  case 'kitchen':kitchenDlg(false);break;
  case 'ntGo':b.remove();if(m&&!$('#pick').classList.contains('open')&&!$('#fech').classList.contains('open')&&!$('#dlg').classList.contains('open')){cur=m;view='mesa';render();scrollTo(0,0)}break;
  case 'rulesCopy':copy(FB_RULES,'Regras','Regras copiadas');break;
  case 'lvCreate':{const u=normUrl($('#lvU').value);LVU=u;if(!okUrl(u)){toast('Endereço inválido. Copie da aba Dados do Firebase');break}
    const go=()=>lvConnect(u,newKey(),true);if(!S.dev){formDlg('Nome deste celular',[['Como os outros vão te ver (ex.: João)']],'Salvar',([n])=>{if(!n)return'Coloque um nome.';S.dev=n.slice(0,24);save();setTimeout(go,50)})}else go();break}
  case 'lvJoin':{const t=$('#lvJ').value.replace(/\s+/g,'');const mm=t.match(/CMDSALA\.([A-Za-z0-9_-]+)/);let c=null;try{c=mm&&JSON.parse(ub64u(mm[1]))}catch(x){}
    if(!c||!okUrl(c.u)||!c.k||c.k.length<20){toast('Convite inválido. Cole a mensagem inteira');break}
    const go=()=>lvConnect(c.u,c.k,false);if(!S.dev){formDlg('Nome deste celular',[['Como os outros vão te ver (ex.: Maria)']],'Salvar',([n])=>{if(!n)return'Coloque um nome.';S.dev=n.slice(0,24);save();setTimeout(go,50)})}else go();break}
  case 'lvOn':liveStart();render();break;
  case 'lvOff':liveStop();render();toast('Tempo real desligado neste celular');break;
  case 'lvInvite':LVINV=`Convite para a sala das comandas${S.name?' de '+S.name:''}\nAbra o app em Sincronizar → Tempo real → Entrar na sala e cole:\nCMDSALA.${b64u(JSON.stringify({u:LV.url,k:LV.key}))}`;render();setTimeout(()=>{const x=$('.live textarea');x&&x.scrollIntoView({block:'center',behavior:'smooth'})},50);break;
  case 'lvInvCopy':copy(LVINV,'Convite','Convite copiado');break;
  case 'lvLeave':ask('Sair da sala?','Este celular para de receber e mandar pedidos online. Os pedidos que já estão aqui continuam.','Sair',true,()=>{liveStop();LV={snd:LV.snd};saveLV();R=null;LVINV='';render()});break;
  case 'syTog':SY.ex.has(m)?SY.ex.delete(m):SY.ex.add(m);SY.out='';render();break;
  case 'syGen':if(!S.dev){formDlg('Nome deste celular',[['Como o outro celular vai te ver (ex.: João)']],'Salvar e gerar',([n])=>{if(!n)return'Coloque um nome.';S.dev=n.slice(0,24);save();setTimeout(()=>{view='sync';genCode()},50)});break}view='sync';genCode();break;
  case 'syCopy':copy(SY.out,'Código','Código copiado — mande no WhatsApp');break;
  case 'syPaste':if(navigator.clipboard&&navigator.clipboard.readText)navigator.clipboard.readText().then(t=>{SY.code=t;readCode()},()=>{$('#syIn').focus();toast('Segure no campo e toque em Colar')});else{$('#syIn').focus();toast('Segure no campo e toque em Colar')}break;
  case 'syRead':SY.code=$('#syIn').value;readCode();break;
  case 'syCancel':SY.P=null;SY.W=null;SY.log=null;render();break;
  case 'syApply':{if(!SY.W)break;snap();const from=SY.P.from;S=SY.W;save();SY.P=null;SY.W=null;SY.log=null;SY.code='';SY.out='';SY.done=from;render();scrollTo(0,0);toast('Mesas atualizadas',true);break}
  case 'kFull':kitchenDlg(true);break;
  case 'kCopy':{const t=$('#kT').value;const ok=()=>{markSent();closeDlg();render();toast('Copiado — cole no WhatsApp da cozinha')};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>{$('#kT').select();toast('Segure no texto e copie')});else{$('#kT').select();toast('Segure no texto e copie')}break}
  case 'kWa':markSent();setTimeout(()=>{closeDlg();render()},400);break;
  case 'kMark':markSent();closeDlg();render();toast('Marcado como enviado');break;
  case 'copyOpen':closeDlg();save();copy(billText(),'Conta da mesa '+cur,'Conta copiada');break;
  case 'cancelOrder':ask('Cancelar comanda?',`Todos os itens da mesa ${cur} vão ser apagados.`,'Apagar tudo',true,()=>{snap();markGone(S.orders[cur],null);delete S.orders[cur];save();const m0=cur;view='mesas';cur=null;render();toast(`Comanda da mesa ${m0} cancelada`,true)});break;
  case 'add':{const[it,s]=findItem(id);if(!it||!it.on)break;addLine(cur,it,s);updRow(id,true);buzz();break}
  case 'pdec':decLine(cur,id);updRow(id);break;
  case 'pickDone':closePick();break;
  case 'jump':{const s=$('#sec'+si);if(s)$('#pickBody').scrollTo({top:s.offsetTop-4,behavior:'smooth'});else{$('#q').value='';renderPick();const s2=$('#sec'+si);s2&&$('#pickBody').scrollTo({top:s2.offsetTop-4})}break}
  case 'avulso':formDlg('Item avulso',[['Nome do item',$('#q').value],['Preço (R$)','',1]],'Adicionar',([n,p])=>{const c=parseBRL(p);if(!n)return'Coloque o nome.';if(isNaN(c)||c<=0)return'Preço inválido.';addLine(cur,{id:'x'+Date.now(),n,p:c},{t:'Avulso',kz:true});pickBar();renderPick();toast(n+' adicionado')});break;
  case 'closeBill':openClose();break;
  case 'fechX':$('#fech').classList.remove('open');lock();break;
  case 'pay':F.pay=F.pay===b.dataset.v?'':b.dataset.v;save();renderClose();break;
  case 'mode':F.mode=b.dataset.v;save();renderClose();break;
  case 'eqInc':F.n=Math.min(99,F.n+1);save();renderClose();break;
  case 'eqDec':F.n=Math.max(2,F.n-1);F.parts.length=Math.min(F.parts.length,F.n);save();renderClose();break;
  case 'partPay':F.parts[ii]=F.parts[ii]===b.dataset.v?'':b.dataset.v;save();renderClose();break;
  case 'ppSel':F.cur=ii;save();renderClose();break;
  case 'ppAdd':F.people.push(mkP(F.people.length));F.cur=F.people.length-1;save();renderClose();break;
  case 'ppRen':{const q=F.people[F.cur];formDlg('Nome da pessoa',[['Nome',q.n]],'Salvar',([n])=>{if(!n)return'Coloque um nome.';q.n=n.slice(0,24);save();renderClose()});break}
  case 'ppDel':{const q=F.people[F.cur];const go=()=>{F.people.splice(F.cur,1);F.cur=Math.max(0,F.cur-1);save();renderClose()};Object.keys(q.a).length?ask(`Remover ${esc(q.n)}?`,'Os itens dela voltam para "falta separar".','Remover',true,go):go();break}
  case 'ppInc':{const l=S.orders[cur].items.find(x=>x.u===b.dataset.u);if(l&&remU(l)>0){const q=F.people[F.cur];q.a[l.u]=(q.a[l.u]||0)+1;save();renderClose();buzz()}break}
  case 'ppDec':{const q=F.people[F.cur],u=b.dataset.u;if(q.a[u]>0){q.a[u]--;if(!q.a[u])delete q.a[u];save();renderClose()}break}
  case 'ppShare':{const l=S.orders[cur].items.find(x=>x.u===b.dataset.u);if(l&&remU(l)>0){SH={u:l.u,q:remU(l),ids:new Set(F.people.map(p=>p.id))};drawShare()}break}
  case 'shTog':{const i=b.dataset.id;SH.ids.has(i)?SH.ids.delete(i):SH.ids.add(i);drawShare();break}
  case 'shInc':{const l=S.orders[cur].items.find(x=>x.u===SH.u);if(l&&SH.q<remU(l))SH.q++;drawShare();break}
  case 'shDec':SH.q=Math.max(1,SH.q-1);drawShare();break;
  case 'ppUnshare':F.shr=F.shr.filter(g=>g.u!==b.dataset.u);save();renderClose();break;
  case 'ppRest':{const q=F.people[F.cur];S.orders[cur].items.forEach(l=>{const r=remU(l);if(r>0)q.a[l.u]=(q.a[l.u]||0)+r});save();renderClose();toast('Resto foi para '+q.n);break}
  case 'ppPay':{const q=F.people[ii];q.pay=q.pay===b.dataset.v?'':b.dataset.v;save();renderClose();break}
  case 'copyBill':copy(billText(),'Conta da mesa '+cur,'Conta copiada');break;
  case 'confirmClose':{const o=S.orders[cur];if(!o)break;prepSplit(o);
    const go=()=>{snap();const s=subOf(o),t=F.svc?svc(s):0;let parts=null,pay=F.pay,ppl=1;
      if(F.mode==='eq'){parts=alloc(s+t,Array(F.n).fill(1)).map((v,i)=>({n:'Parte '+(i+1),v,pay:F.parts[i]||''}));ppl=F.n}
      if(F.mode==='pp'){const C=calcPeople(o);parts=F.people.map((q,i)=>({n:q.n,v:C.sub[i]+C.sv[i],pay:q.pay||''}));ppl=F.people.length;if(C.left>0)parts.push({n:'Não separado',v:C.left+t-C.sv.reduce((a,x)=>a+x,0),pay:''})}
      if(parts)pay=[...new Set(parts.map(x=>x.pay).filter(Boolean))].join(' + ');
      ens(o);const items=o.items.map(({sp,...r})=>r);markGone(o,o.items.map(l=>l.u));
      S.hist.push({id:Date.now(),m:cur,t0:o.t,t1:Date.now(),items,sub:s,svc:t,pct:S.pct,pay,ppl,parts,by:S.dev||'',bd:S.did,oid:o.id});delete S.orders[cur];save();
      $('#fech').classList.remove('open');lock();const m0=cur;view='mesas';cur=null;render();scrollTo(0,0);toast(`Mesa ${m0} fechada · ${brl(s+t)}`,true)};
    if(F.mode==='pp'&&calcPeople(o).left>0)ask('Ainda falta separar',`Tem ${brl(calcPeople(o).left)} em itens sem dono. Fechar mesmo assim?`,'Fechar',false,go);else go();break}
  case 'reopen':{const h=S.hist.find(x=>x.id===+id);if(!h)break;if(S.orders[h.m]){toast(`A mesa ${h.m} está ocupada agora`);break}
    ask(`Reabrir mesa ${h.m}?`,'A conta sai das fechadas e volta como comanda aberta.','Reabrir',false,()=>{snap();const now=Date.now();S.orders[h.m]={id:uid(),t:h.t0,mt:now,del:{},items:h.items.map(l=>({...l,u:uid(),ts:now,bd:S.did}))};S.hgone[h.id]=now;S.hist=S.hist.filter(x=>x!==h);save();cur=h.m;view='mesa';render();scrollTo(0,0)});break}
  case 'clearHist':guard(()=>ask('Limpar histórico?','Todas as contas fechadas vão ser apagadas deste celular.','Limpar',true,()=>{snap();S.hist.forEach(h=>S.hgone[h.id]=Date.now());S.hist=[];save();render();toast('Histórico limpo',true)}));break;
  case 'addMesa':snap();S.mesas=Math.min(200,S.mesas+1);save();render();toast(`Mesa ${S.mesas} criada`,true);break;
  case 'mesasInc':S.mesas=Math.min(200,S.mesas+1);save();render();break;
  case 'mesasDec':{const m=S.mesas;if(m<=1)break;if(S.orders[m]){toast(`A mesa ${m} está aberta, feche antes`);break}S.mesas=m-1;save();render();break}
  case 'mesas5':S.mesas=Math.min(200,S.mesas+5);save();render();toast(`Agora são ${S.mesas} mesas`);break;
  case 'pctInc':S.pct=Math.min(30,S.pct+1);save();render();break;
  case 'pctDec':S.pct=Math.max(0,S.pct-1);save();render();break;
  case 'newItem':formDlg('Novo item em '+esc(S.menu[si].t),[['Nome'],['Preço (R$)','',1],['Número no cardápio (opcional)'],['Descrição (opcional)']],'Adicionar',([n,p,c,d])=>{const v=parseBRL(p);if(!n)return'Coloque o nome.';if(isNaN(v)||v<0)return'Preço inválido.';S.menu[si].items.push({id:'n'+Date.now(),c,n,p:v,d,on:true});openSecs.add(si);save();render()});break;
  case 'delItem':{const it=S.menu[si].items[ii];ask('Excluir item?',`${esc(it.n)} sai do cardápio. Comandas abertas não mudam.`,'Excluir',true,()=>{snap();S.menu[si].items.splice(ii,1);save();render();toast('Item excluído',true)});break}
  case 'newSec':formDlg('Nova seção',[['Nome da seção (ex.: Chopp)']],'Criar',([n])=>{if(!n)return'Coloque o nome.';S.menu.push({t:n,note:'',items:[]});openSecs.add(S.menu.length-1);save();render()});break;
  case 'delSec':ask('Excluir seção?',`${esc(S.menu[si].t)} e os ${S.menu[si].items.length} itens dela saem do cardápio.`,'Excluir',true,()=>{snap();S.menu.splice(si,1);openSecs.clear();save();render();toast('Seção excluída',true)});break;
  case 'resetMenu':ask('Restaurar cardápio?','Volta o cardápio original com os preços da foto. Suas mudanças no cardápio são perdidas.','Restaurar',true,()=>{snap();S.menu=buildMenu();save();render();toast('Cardápio restaurado',true)});break;
  case 'bkCopy':copy(JSON.stringify(S),'Backup','Backup copiado');break;
  case 'bkLoad':dlg(`<h2>Restaurar backup</h2><p>Cole o texto do backup. Isso substitui tudo o que está no celular.</p><textarea class="cp" id="bkT" data-focus></textarea><p id="ferr" style="color:var(--bad)"></p><div class="dbtn"><button class="btn gh" data-act="dlgNo">Cancelar</button><button class="btn bad" data-act="dlgOk">Restaurar</button></div>`,()=>{try{const o=JSON.parse($('#bkT').value);if(!o||!Array.isArray(o.menu))throw 0;snap();const d0=S.did;S=Object.assign(defaults(),migrate(o));S.did=d0;touchCfg();save();render();toast('Backup restaurado',true)}catch(err){$('#ferr').textContent='Esse texto não é um backup válido.';return false}});break;
  case 'dlgOk':if(D.ok&&D.ok()===false)break;closeDlg();break;
  case 'dlgNo':closeDlg();break;
  case 'undo':if(undoSnap){S=JSON.parse(undoSnap);undoSnap=null;save();render();$('#toast').classList.remove('on')}break;
  }
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='svcT'){F.svc=t.checked;save();renderClose();return}
  if(t.id==='lvSnd'){LV.snd=t.checked;saveLV();return}
  if(t.dataset.set==='name'||t.dataset.set==='zap'||t.dataset.sf||t.dataset.f||t.dataset.sk!==undefined)touchCfg();
  if(t.dataset.set==='name'){S.name=t.value.trim();save();return}
  if(t.dataset.set==='dev'){S.dev=t.value.trim().slice(0,24);save();toast(S.dev?'Nome salvo':'Sem nome');render();return}
  if(t.id==='syH'){SY.h=t.checked;SY.out='';render();return}
  if(t.id==='syM'){SY.menu=t.checked;SY.out='';render();return}
  if(t.dataset.set==='zap'){let d=t.value.replace(/\D/g,'');if(d.length===10||d.length===11)d='55'+d;S.zap=d;t.value=d;save();toast(d?'WhatsApp da cozinha salvo':'Sem número fixo');return}
  if(t.dataset.sk!==undefined){S.menu[+t.dataset.sk].kz=t.checked;save();toast(t.checked?'Vai para a cozinha':'Não vai para a cozinha');return}
  if(t.dataset.sf){S.menu[+t.dataset.s].t=t.value.trim()||S.menu[+t.dataset.s].t;save();render();return}
  if(t.dataset.f){const it=S.menu[+t.dataset.s].items[+t.dataset.i];const f=t.dataset.f;
    if(f==='n'){it.n=t.value.trim()||it.n;t.value=it.n}
    else if(f==='p'){const c=parseBRL(t.value);if(!isNaN(c)&&c>=0){it.p=c;toast('Preço salvo')}t.value=num(it.p)}
    else if(f==='on'){it.on=t.checked;toast(it.on?it.n+' disponível':it.n+' em falta')}
    save()}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('grp'))d.open?grpOpen.add(d.dataset.g):grpOpen.delete(d.dataset.g);if(d.classList&&d.classList.contains('tk')&&d.open)document.querySelectorAll('.tk[open]').forEach(x=>{if(x!==d)x.open=false});if(d.classList&&d.classList.contains('ed')){const i=+d.dataset.sec;d.open?openSecs.add(i):openSecs.delete(i)}},true);
document.addEventListener('input',e=>{if(e.target.id==='syIn')SY.code=e.target.value;if(e.target.id==='kT'){const a=$('#kWa');if(a)a.href=waHref(e.target.value)}});
$('#q').addEventListener('input',()=>{renderPick();$('#pickBody').scrollTop=0});
let rq=0;$('#pickBody').addEventListener('scroll',()=>{if(rq)return;rq=requestAnimationFrame(()=>{rq=0;activeChip()})},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&$('#dlg').classList.contains('open')&&e.target.tagName==='INPUT'){e.preventDefault();const ok=$('#dlgBox [data-act="dlgOk"]');ok&&ok.click()}
  if(e.key==='Escape'){if($('#dlg').classList.contains('open'))closeDlg();else if($('#fech').classList.contains('open')){$('#fech').classList.remove('open');lock()}else if($('#pick').classList.contains('open'))closePick()}});
if(LV.on&&LV.url&&LV.key)liveStart();
window.addEventListener('online',()=>{if(LV.on){if(!ES||ES.readyState===2)liveStart();else schedPush()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&LV.on&&(!ES||ES.readyState===2))liveStart()});
setInterval(()=>{if((view==='mesas'||view==='mesa')&&!$('#dlg').classList.contains('open')&&!document.body.classList.contains('lock'))render()},30000);
render();
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
